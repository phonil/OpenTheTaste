# -------------------------------------------------------
# k6 부하 테스트용 InfluxDB
#
# 용도:
#   k6 결과를 시계열로 저장. 기존 Grafana(apps/monitoring, 포트 3001)에서 조회.
#
# 실행:
#   docker-compose -f k6/docker-compose.monitoring.yml up -d
#
# k6 연동:
#   k6 run --out influxdb=http://localhost:8086/k6 k6/scenarios/home-screen.js
#
# 기존 Grafana에서 데이터소스 추가 (최초 1회):
#   1. http://localhost:3001 접속
#   2. Data Sources → Add → InfluxDB
#      - URL: http://host.docker.internal:8086  (또는 호스트 IP)
#      - Database: k6
#   3. Dashboards → Import → ID: 2587 (k6 공식 대시보드)
#
# 종료:
#   docker-compose -f k6/docker-compose.monitoring.yml down
#
# 데이터 초기화 (결과 리셋):
#   docker-compose -f k6/docker-compose.monitoring.yml down -v
# -------------------------------------------------------

services:
  influxdb:
    image: influxdb:1.8
    container_name: k6-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - default
      - backend_shared

volumes:
  influxdb-data:

networks:
  backend_shared:
    external: true
    name: ${BACKEND_SHARED_NETWORK:-backend_default}
